name: Сообщить об ошибке
description: Сообщите о воспроизводимом дефекте СПИКЕР.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Версия СПИКЕР
      placeholder: 3.0.8
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение и обезличенная ошибка
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Конфиденциальность
      options:
        - label: Я удалил из отчёта API-ключи, записи, персональные данные и приватный текст.
          required: true
